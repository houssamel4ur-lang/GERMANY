name: Website and curriculum checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check data/lessons.js
          node --check data/syllabus.js
          node --check data/master-curriculum.js
          node --check assets/master-curriculum.js
          node --check data/phonetics.js
          node --check assets/phonetics.js
          node --check data/course-a1-grammar.js
          node --check data/course-a1-skills.js
          node --check data/course-a2-grammar.js
          node --check data/course-a2-skills.js
          node --check data/primary-lesson-links.js
          node --check data/primary-phonetics.js
          node --check data/structured-a1-pronunciation.js
          node --check assets/primary-study.js
          node --check assets/lesson-flow.js
          node --check assets/primary-home.js
          node --check data/curriculum-2026.js
          node --check data/curriculum-lessons-2026.js
          node --check data/curated-primary-2026.js
          node --check assets/curriculum-app.js
          node --check data/advanced-grammar-b1.js
          node --check data/advanced-grammar-b2.js
          node --check data/advanced-grammar-b1-more.js
          node --check data/advanced-grammar-b2-more.js
          node --check data/advanced-merge.js
          node --check data/learning-modules.js
          node --check assets/module-study.js
          node --check assets/master-curriculum.js
          node --check data/foundation-a1.js
          node --check data/foundation-a2.js
          node --check data/foundation-merge.js
          node --check assets/ai-chat.js
          node --check assets/ai-live.js
          node --check selfhost-ai/export-curriculum.mjs
          node --check assets/ai-config.js
      - name: Validate curriculum and site
        run: node tests/check.mjs
      - name: Verify pedagogical lesson-stage order for all PDF topics
        run: node tests/stage-flow-check.mjs
      - name: Validate secure AI conversation backend
        run: node tests/ai-check.mjs
      - name: Verify locally owned AI lessons context
        run: node selfhost-ai/export-curriculum.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python self-hosted AI server
        run: |
          python -m pip install --disable-pip-version-check fastapi httpx python-multipart
          python -m py_compile selfhost-ai/server.py
          python -m unittest discover -s selfhost-ai/tests -v
