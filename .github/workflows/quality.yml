name: Website and curriculum checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check data/lessons.js
          node --check data/syllabus.js
          node --check data/master-curriculum.js
          node --check assets/master-curriculum.js
          node --check data/phonetics.js
          node --check assets/phonetics.js
          node --check data/course-a1-grammar.js
          node --check data/course-a1-skills.js
          node --check data/course-a2-grammar.js
          node --check data/course-a2-skills.js
          node --check data/primary-lesson-links.js
          node --check data/primary-phonetics.js
          node --check assets/primary-study.js
          node --check assets/primary-home.js
          node --check data/curriculum-2026.js
          node --check data/curriculum-lessons-2026.js
          node --check data/curated-primary-2026.js
          node --check assets/curriculum-app.js
      - name: Validate curriculum and site
        run: node tests/check.mjs
