name: Browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'syllabus.html'
      - 'course.html'
      - 'practice.html'
      - 'pack.html'
      - 'journey.html'
      - 'review-primary.html'
      - 'assets/primary-study.js'
      - 'assets/lesson-flow.js'
      - 'assets/lesson-structure.css'
      - 'assets/primary-home.js'
      - 'assets/curriculum-app.js'
      - 'data/curriculum-lessons-2026.js'
      - 'data/curated-primary-2026.js'
      - 'data/advanced-grammar-b1.js'
      - 'data/advanced-grammar-b2.js'
      - 'data/advanced-grammar-b1-more.js'
      - 'data/advanced-grammar-b2-more.js'
      - 'data/advanced-merge.js'
      - 'data/foundation-a1.js'
      - 'data/foundation-a2.js'
      - 'data/foundation-merge.js'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Confirm preinstalled browser
        run: which google-chrome || which google-chrome-stable || which chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/deutsch-http.log 2>&1 &
      - run: node tests/browser-smoke.mjs
