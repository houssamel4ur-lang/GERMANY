name: Build German Audio MP3s
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/german-audio.yml'
      - 'scripts/audio_manifest.mjs'
      - 'scripts/german_audio.py'
      - 'data/curriculum-lessons-2026.js'
      - 'data/curated-primary-2026.js'
      - 'data/advanced-grammar-b1.js'
      - 'data/advanced-grammar-b2.js'
      - 'data/advanced-grammar-b1-more.js'
      - 'data/advanced-grammar-b2-more.js'
      - 'data/advanced-merge.js'
  workflow_dispatch:
    inputs:
      mode:
        description: "Subset or full German audio library"
        required: true
        type: choice
        options:
          - smoke
          - all
        default: smoke

concurrency:
  group: german-audio-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-german-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install German synthesis engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check edge-tts
      - name: Create German-only text manifest
        env:
          AUDIO_MODE: ${{ inputs.mode || 'all' }}
        run: node scripts/audio_manifest.mjs "$AUDIO_MODE" > /tmp/german-manifest.json
      - name: Generate German audio
        run: python scripts/german_audio.py /tmp/german-manifest.json
      - name: Commit generated MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio data/audio-index.js data/audio-status.json
          if ! git diff --cached --quiet; then
            git commit -m "audio: publish verified German MP3 pronunciation recordings"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not publish audio after 5 attempts" >&2
              exit 1
            fi
          else
            echo "No new German audio to commit"
          fi
