<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرس | Deutsch Mastery</title></head><body><p>افتح الدروس من <a href="syllabus.html">الفهرس المعتمد</a>.</p><script>(function(){const id=new URLSearchParams(location.search).get("id")||"";const m=/^([ab][12])-g(\d{2})-(\d{2})$/i.exec(id);let target="syllabus.html";if(m){const level=m[1].toUpperCase(),g=Number(m[2]),n=m[3],base={A1:1,A2:6,B1:9,B2:12}[level],section=g-base+1;if(section>0&&section<6)target="course.html?topic="+level+"-"+String(section).padStart(2,"0")+"-"+n;}else if(/^(A1|A2|B1|B2)-\d{2}-\d{2}$/.test(id)){target="course.html?topic="+id;}location.replace(target);})();</script></body></html>
